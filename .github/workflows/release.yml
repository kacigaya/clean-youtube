name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun test
      - run: bun run compile
      - run: bun run build:firefox
      - run: bun run lint:firefox
      - run: bunx --no-install playwright install --with-deps chromium firefox
      - run: bun run test:browser

      - run: bun run zip
      - run: bun run zip:firefox

      # Restrict uploads to browser ZIPs so source ZIPs cannot be published by accident.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
