name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Ship nothing that fails the same checks used locally.
      - run: bun test
      - run: bun run compile
      - run: bun run build:firefox
      - run: bun run lint:firefox
      - run: bunx --no-install playwright install --with-deps chromium firefox
      - run: bun run test:browser

      - run: bun run zip
      - run: bun run zip:firefox

      # Named explicitly rather than globbed, so re-enabling zip.zipSources in
      # wxt.config.ts cannot quietly start publishing a sources zip.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
