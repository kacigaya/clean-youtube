name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Ship nothing that fails the same checks used locally.
      - run: bun test
      - run: bun run compile

      - run: bun run zip
      - run: bun run zip:firefox

      # Named explicitly rather than globbed, so re-enabling zip.zipSources in
      # wxt.config.ts cannot quietly start publishing a sources zip.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
