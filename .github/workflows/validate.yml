name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run compile
      - run: bun run build:firefox
      - run: bun run lint:firefox
      - run: bunx --no-install playwright install --with-deps chromium firefox
      # Playwright builds both browsers before serving its deterministic fixtures.
      - run: bun run test:browser
